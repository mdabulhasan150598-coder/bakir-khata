name: Build Flutter APK

on:
  push:
    branches: [ main, premium-modern-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড চেকআউট
        uses: actions/checkout@v4

      - name: Java সেটআপ
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter সেটআপ
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: প্রজেক্ট অটো-বিল্ড সেটআপ
        run: |
          # ১. একদম ফ্রেশ ও নির্ভুল ফোল্ডার তৈরি
          flutter create app --project-name baki_khata --platforms=android

          # Telegram backup-এর জন্য Android Internet permission নিশ্চিত করা
          python - <<'PY'
          from pathlib import Path
          manifest = Path("app/android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
          ]
          insert_at = content.find(">", content.find("<manifest")) + 1
          missing = [p for p in permissions if p.split('"')[1] not in content]
          if missing:
              content = content[:insert_at] + "\n" + "\n".join(missing) + content[insert_at:]
              manifest.write_text(content)
          PY

          # ২. আপনার মূল কোডটি নতুন প্রজেক্টে বসানো
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart app/lib/main.dart
          elif [ -f "main.dart" ]; then
            cp main.dart app/lib/main.dart
          fi

          # ৩. Android-এ প্রয়োজনীয় প্যাকেজগুলো যোগ করা
          cd app
          flutter pub add shared_preferences intl path_provider
          flutter pub add file_picker:^10.3.10
          flutter pub add share_plus:^10.1.4

      - name: APK তৈরি করা
        run: |
          cd app
          flutter build apk --release

      - name: APK ফাইল আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: Bakir-Khata-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
